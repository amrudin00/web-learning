<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR (Flex) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="#">MySite</a>
</nav>

<!-- MAIN LOGIN SECTION -->
<div class="container py-5">

    <div class="row justify-content-center align-items-center">
        
        <!-- Image Side (Grid + Responsive) -->
        <div class="col-md-6 d-none d-md-flex justify-content-center">
            <img src="images/d881ea17-ade8-465e-84b6-0d5e28bf1ee8.jpg" class="img-fluid rounded shadow" style="width: 300px;height: 500px;">
        </div>

        <!-- Login Form Side -->
        <div class="col-12 col-md-5">
            <div class="card p-4 shadow-sm">
                <h3 class="text-center mb-3">Login</h3>

                <form>
                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter email">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter password">
                    </div>

                    <!-- Flexbox Buttons -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label for="remember" class="form-check-label">Remember me</label>
                        </div>
                        <a href="#" class="text-primary">Forgot Password?</a>
                    </div>

                    <button class="btn btn-primary w-100">Login</button>
                </form>

                <!-- Footer Text -->
                <p class="text-center mt-3">
                    Don't have an account?
                    <a href="#" class="text-primary">Register</a>
                </p>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
